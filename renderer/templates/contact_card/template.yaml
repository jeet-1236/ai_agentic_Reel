name: contact_card
description: Heading plus 1-3 contacts (label + value). Values MUST come from contacts_whitelist.json (the Editor only fills whitelisted contacts).
aspects: ["9x16", "16x9"]
min_duration_s: 2.0
max_duration_s: 12.0
image: none
zone: content
from_on_screen_text: "items that contain a whitelisted contact (phone/email/url) -> contacts (label from the whitelist); first other item -> title"
slots_schema:
  type: object
  additionalProperties: false
  required: [contacts]
  properties:
    title: {type: string, maxLength: 60}
    contacts:
      type: array
      minItems: 1
      maxItems: 3
      items:
        type: object
        additionalProperties: false
        required: [value]
        properties:
          label: {type: string, maxLength: 60}
          value: {type: string, minLength: 1, maxLength: 60}
          kind: {type: string, enum: [phone, email, url]}
text:
  title: {weight: 800, line_height: 1.1,
          "9x16": {w: 900, h: 150, max_px: 72, min_px: 48}, "16x9": {w: 1500, h: 100, max_px: 72, min_px: 48}}
  contacts.label: {list: true, weight: 400, line_height: 1.1, max_lines: 1, per_item: true,
                   "9x16": {w: 800, h: 60, max_px: 48, min_px: 48}, "16x9": {w: 1400, h: 60, max_px: 48, min_px: 48}}
  contacts.value: {list: true, weight: 800, line_height: 1.1, max_lines: 1, per_item: true,
                   "9x16": {w: 800, h: 100, max_px: 84, min_px: 48}, "16x9": {w: 1400, h: 100, max_px: 84, min_px: 48}}
