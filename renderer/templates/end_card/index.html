<div class="tpl tpl-end">
  <div class="ec-logo-box" style="width:{{logo_box.w}}px;height:{{logo_box.h}}px"><img class="ec-logo" data-logo="1" src="{{logo_src}}" alt="logo" /></div>
  <div class="row"><span class="txt w800 ec-cta" data-text="cta" style="font-size:{{cta.px}}px;line-height:{{cta.lh}}">{{{cta.html}}}</span></div>
  {{#url}}<div class="row"><span class="txt w700 ec-url" data-text="url" style="font-size:{{url.px}}px;line-height:{{url.lh}}">{{{url.html}}}</span></div>{{/url}}
  <div class="row ec-disc-row"><span class="txt w400 ec-disc" data-text="disclosure" style="font-size:{{disclosure.px}}px;line-height:{{disclosure.lh}}">{{{disclosure.html}}}</span></div>
</div>
