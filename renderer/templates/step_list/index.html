<div class="tpl tpl-steps">
  {{#title}}<div class="row left st-title-row"><span class="txt w800 shadow st-title" data-text="title" style="font-size:{{title.px}}px;line-height:{{title.lh}}">{{{title.html}}}</span></div>{{/title}}
  <div class="st-list">{{#steps}}<div class="st-item"><span class="st-num"><span class="txt w800" data-text="number" style="font-size:48px;line-height:1">{{n}}</span></span><span class="txt w700 st-text" data-text="steps" style="font-size:{{px}}px;line-height:{{lh}}">{{{html}}}</span></div>{{/steps}}</div>
</div>
