<div class="tpl tpl-dd">
  <div class="dd-panel dd-do">
    <div class="dd-head"><span class="dd-icon dd-tick"></span><span class="txt w800 dd-label" data-text="do_label" style="font-size:{{do_label.px}}px;line-height:{{do_label.lh}}">{{{do_label.html}}}</span></div>
    <div class="dd-items">{{#do_items}}<div class="dd-item"><span class="dd-dot"></span><span class="txt w700" data-text="do_items" style="font-size:{{px}}px;line-height:{{lh}}">{{{html}}}</span></div>{{/do_items}}</div>
  </div>
  <div class="dd-panel dd-dont">
    <div class="dd-head"><span class="dd-icon dd-cross"></span><span class="txt w800 dd-label" data-text="dont_label" style="font-size:{{dont_label.px}}px;line-height:{{dont_label.lh}}">{{{dont_label.html}}}</span></div>
    <div class="dd-items">{{#dont_items}}<div class="dd-item"><span class="dd-dot"></span><span class="txt w700" data-text="dont_items" style="font-size:{{px}}px;line-height:{{lh}}">{{{html}}}</span></div>{{/dont_items}}</div>
  </div>
</div>
