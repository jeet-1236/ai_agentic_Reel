name: do_dont_split
description: Two panels, "Do" (green tick) and "Don't" (red cross), with 1-3 short items each. Stacked in 9:16, side by side in 16:9.
aspects: ["9x16", "16x9"]
min_duration_s: 2.0
max_duration_s: 14.0
image: none
zone: content
from_on_screen_text: >-
  items starting with "Don't", "Do not", "Never", "Avoid", "No " or "✗" -> dont_items (prefix stripped);
  items starting with "Do:" / "✓" or anything else -> do_items; if nothing is classified as dont,
  the second half becomes dont_items
slots_schema:
  type: object
  additionalProperties: false
  required: [do_items, dont_items]
  properties:
    do_label: {type: string, maxLength: 16}
    dont_label: {type: string, maxLength: 16}
    do_items: {type: array, minItems: 1, maxItems: 3, items: {type: string, minLength: 1, maxLength: 60}}
    dont_items: {type: array, minItems: 1, maxItems: 3, items: {type: string, minLength: 1, maxLength: 60}}
defaults: {do_label: "Do", dont_label: "Don't"}
text:
  do_label: {weight: 800, line_height: 1.1, max_lines: 1, upper: true,
             "9x16": {w: 600, h: 64, max_px: 56, min_px: 48}, "16x9": {w: 560, h: 64, max_px: 56, min_px: 48}}
  dont_label: {weight: 800, line_height: 1.1, max_lines: 1, upper: true,
               "9x16": {w: 600, h: 64, max_px: 56, min_px: 48}, "16x9": {w: 560, h: 64, max_px: 56, min_px: 48}}
  do_items: {list: true, weight: 700, line_height: 1.12, gap: 14,
             "9x16": {w: 740, h: 270, max_px: 56, min_px: 48}, "16x9": {w: 640, h: 500, max_px: 60, min_px: 48}}
  dont_items: {list: true, weight: 700, line_height: 1.12, gap: 14,
               "9x16": {w: 740, h: 270, max_px: 56, min_px: 48}, "16x9": {w: 640, h: 500, max_px: 60, min_px: 48}}
