name: stat_callout
description: One big number/fact (e.g. "1930" or "3 steps") with a label and a small source line.
aspects: ["9x16", "16x9"]
min_duration_s: 1.5
max_duration_s: 10.0
image: optional
zone: content
from_on_screen_text: "[0] -> stat, [1] -> label (optional); source = host of the first fact URL"
slots_schema:
  type: object
  additionalProperties: false
  required: [stat]
  properties:
    stat: {type: string, minLength: 1, maxLength: 24}
    label: {type: string, maxLength: 80}
    source: {type: string, maxLength: 60}
text:
  stat: {weight: 800, line_height: 1.0, max_lines: 2,
         "9x16": {w: 820, h: 330, max_px: 230, min_px: 72}, "16x9": {w: 1400, h: 300, max_px: 220, min_px: 72}}
  label: {weight: 700, line_height: 1.15,
          "9x16": {w: 860, h: 300, max_px: 68, min_px: 48}, "16x9": {w: 1400, h: 200, max_px: 64, min_px: 48}}
  source: {weight: 400, line_height: 1.15, max_lines: 1, prefix: "Source: ",
           "9x16": {w: 860, h: 64, max_px: 48, min_px: 48}, "16x9": {w: 1400, h: 64, max_px: 48, min_px: 48}}
