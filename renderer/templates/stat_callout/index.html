<div class="tpl tpl-stat">
  <div class="row"><span class="txt w800 sc-stat" data-text="stat" style="font-size:{{stat.px}}px;line-height:{{stat.lh}}">{{{stat.html}}}</span></div>
  {{#label}}<div class="row"><span class="txt w700 shadow sc-label" data-text="label" style="font-size:{{label.px}}px;line-height:{{label.lh}}">{{{label.html}}}</span></div>{{/label}}
  {{#source}}<div class="row"><span class="txt w400 sc-source" data-text="source" style="font-size:{{source.px}}px;line-height:{{source.lh}}">{{{source.html}}}</span></div>{{/source}}
</div>
