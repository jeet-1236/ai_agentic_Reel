<div class="tpl tpl-hook">
  {{#kicker}}<div class="row"><span class="txt w700 red kicker" data-text="kicker" style="font-size:{{kicker.px}}px;line-height:{{kicker.lh}}">{{{kicker.html}}}</span></div>{{/kicker}}
  <div class="row"><span class="txt w800 shadow title" data-text="title" style="font-size:{{title.px}}px;line-height:{{title.lh}}">{{{title.html}}}</span></div>
  <div class="bar"></div>
  {{#subtitle}}<div class="row"><span class="txt w700 shadow subtitle" data-text="subtitle" style="font-size:{{subtitle.px}}px;line-height:{{subtitle.lh}}">{{{subtitle.html}}}</span></div>{{/subtitle}}
</div>
